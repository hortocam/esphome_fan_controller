# UCG-Max Fan Controller — ESPHome config
#
# ESPHome-driven 4-wire PWM fan for the UniFi UCG-Max.
#
# DESIGN GOAL: the firmware is agnostic about WHERE the temperature comes from.
# It subscribes to MQTT topics only. The Prometheus -> MQTT bridge
# (scripts/prometheus_to_mqtt.py) is the ONE place an SNMP OID / PromQL query
# appears, so pointing this at a different metric, router, or data source never
# touches the device firmware. Swap the bridge, not the board.
#
# STATUS: PENDING — initial layout, NOT yet flashed. Pin assignments are
# PLACEHOLDERS (GPIO_NC). Read the board silkscreen / wiring table first (see
# the esp32-firmware skill) and set the real pins before building.

substitutions:
  device_name: fan-controller
  # Duty (0.0-1.0) driven when MQTT data is stale or was never received.
  fail_duty: "0.5"
  # Seconds of silence before the failsafe engages.
  stale_timeout: "60"

esphome:
  name: ${device_name}
  friendly_name: UCG-Max Fan Controller

# Reports the reason for the last boot (brownout, watchdog, panic, ...).
# Exposed as a text sensor in HA/MQTT — answers "why did it reboot?" after
# the fact, which the runtime logs can't (they're lost on a hard reset).
debug:
  update_interval: 60s
  reset_reason: true

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# ############################### NETWORK #################################
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP so monitoring/OTA is predictable. Uncomment + adjust.
  # manual_ip:
  #   static_ip: 172.16.20.9
  #   gateway: 172.16.20.1
  #   subnet: 255.255.255.0
  #   dns1: 172.16.10.18
  #   dns2: 8.8.8.8
  reboot_timeout: 0s

# ############################### MQTT ####################################
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true

# ############################ SENSORS ####################################
globals:
  - id: current_temp
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: last_temp_seen
    type: unsigned long
    restore_value: no
    initial_value: "0"

sensor:
  - platform: template
    name: "Router Temperature"
    id: router_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Fan Duty"
    id: fan_duty_sensor
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  - platform: pulse_counter
    name: "Fan RPM"
    id: fan_rpm
    pin: GPIO34         # << TACH - NodeMCU-32S. 10k pull-up to 3.3V required
    update_interval: 5s
    filters:
      - multiply: 0.5    # 2 pulses/rev; 100% = 3000 RPM (was 5.0 = 10x too high)

  # Subscribe to the router temp published by the Prometheus->MQTT bridge.
  # mqtt_subscribe is the reliable way to react to a topic (the top-level
  # mqtt: on_message: trigger was flaky and never fired on this device).
  - platform: mqtt_subscribe
    name: "Router Temp (MQTT)"
    id: mqtt_temp
    topic: homelab/ucgmax/temperature
    qos: 1
    on_value:
      - lambda: |-
          ESP_LOGD("fan", "MQTT temp received: %.1f", x);
          id(current_temp) = x;
          id(last_temp_seen) = millis();
          id(router_temp_sensor).publish_state(x);

# ############################ OUTPUT / FAN ##############################
output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO25         # PWM (NodeMCU-32S). Noctua accepts 3.3V directly
    frequency: 25000 Hz  # 4-wire fan spec: 25 kHz PWM

fan:
  - platform: speed
    id: router_fan
    output: fan_pwm
    name: "Router Fan"
    speed_count: 100

# ########################## FAILSAFE + FAN CURVE #########################
# Fan = Noctua NF-PPC3000 (3000 RPM max). The old controller held temp at
# ~1600-1750 RPM (~55% duty) under load. The curve must keep the fan there.
# <45C -> 45% | 45-60C linear 45->100% | >60C -> 100%
interval:
  - interval: 5s
    then:
      - lambda: |-
          auto clamp01 = [](float v) { return v < 0.0f ? 0.0f : (v > 1.0f ? 1.0f : v); };
          bool have_data = id(last_temp_seen) > 0
                        && (millis() - id(last_temp_seen)) <= (${stale_timeout} * 1000);
          float duty;
          if (!have_data) {
            duty = ${fail_duty};
            id(status_sensor).publish_state("STALE");
          } else {
            float t = id(current_temp);
            duty = (t <= 45.0f) ? 0.45f
                 : (t >= 60.0f) ? 1.00f
                 : 0.45f + (t - 45.0f) / 15.0f * 0.55f;
            id(status_sensor).publish_state("ONLINE");
          }
          duty = clamp01(duty);
          id(router_fan).make_call().set_state(true).set_speed((int)round(duty * 100)).perform();
          id(fan_duty_sensor).publish_state(duty * 100.0f);

text_sensor:
  - platform: template
    name: "Fan Controller Status"
    id: status_sensor
    # The 5s fan-curve interval owns this sensor via publish_state().
    # update_interval: never stops the template sensor from re-evaluating
    # its lambda every 60s and clobbering ONLINE/STALE with a stale "BOOT".
    update_interval: never
    lambda: |-
      return "BOOT";

# ############################ OLED DISPLAY ############################
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.printf(0, 0, id(font_oled), "TEMP %5.1f C", id(current_temp));
      it.printf(0, 16, id(font_oled), "FAN %3d %%", (int)round(id(fan_duty_sensor).state));
      it.printf(0, 32, id(font_oled), "RPM %5d", (int)round(id(fan_rpm).state));
      it.printf(0, 48, id(font_oled), "%s", id(status_sensor).state.c_str());

font:
  - id: font_oled
    file: "gfonts://Roboto"
    size: 12
