# UCG-Max Fan Controller — BENCH TEST CONFIG (first flash, no MQTT)
#
# Purpose: prove the hardware on the bench BEFORE wiring up MQTT/Prometheus.
# No MQTT broker required. On boot it ramps the fan 0->100% in steps and reads
# the tach, so you can confirm in ~30s that:
#   1. WiFi connects (IoT VLAN)
#   2. The fan PWM drives the blade (it visibly spins)
#   3. The tach / RPM reads a real value (GPIO34 + 10k pull-up to 3.3V)
#   4. The OLED renders temp/duty/RPM (GPIO21/22)
#
# This is a throwaway test config - NOT the production one (fan_controller.yaml).
# Commit it alongside so future flashes can re-run the bench check.

substitutions:
  device_name: fan-controller-bench

esphome:
  name: ${device_name}
  friendly_name: UCG-Max Fan Controller (Bench)

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

# ---------- HARDWARE ----------
output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO25
    frequency: 25000 Hz

fan:
  - platform: speed
    id: router_fan
    output: fan_pwm
    name: "Router Fan"
    speed_count: 100

sensor:
  - platform: pulse_counter
    name: "Fan RPM"
    id: fan_rpm
    pin: GPIO34
    update_interval: 2s
    filters:
      - multiply: 0.5

text_sensor:
  - platform: template
    name: "Bench Status"
    id: bench_status
    lambda: |-
      return {"RUNNING"};

# ---------- 30s SPEED SWEEP ----------
# Ramp 0 -> 100% and back twice, 2s per step, so you can SEE the blade
# respond and the RPM climb.
interval:
  - interval: 2s
    then:
      - lambda: |-
          static int step = 0;
          float t = (step % 100) / 99.0f;                 // 0..1 over 100 steps
          float duty = (step / 100) % 2 ? (1.0f - t) : t; // triangle wave 0->1->0
          id(router_fan).turn_on();
          id(router_fan).speed = duty;
          const char* label = duty < 0.01f ? "STOP" : duty < 0.34f ? "LOW " : duty < 0.67f ? "MID  " : "HIGH";
          id(bench_status).publish_state(label);
          step = (step + 1) % 200;

# ---------- OLED ----------
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.printf(0, 0, id(font_oled), "FAN  %3d %%", (int)round(id(router_fan).speed * 100));
      it.printf(0, 20, id(font_oled), "RPM  %5d", (int)round(id(fan_rpm).state));
      it.printf(0, 40, id(font_oled), "%s", id(bench_status).state.c_str());

font:
  - id: font_oled
    file: "gfonts://Roboto"
    size: 12
